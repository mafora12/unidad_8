<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nada se pierde, todo se transforma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="util3d.js"></script>
  <script src="construir.js"></script>
  <script src="prompt.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <div id="lienzo"></div>

  <div id="ui">
    <header>
      <h1>Nada se pierde,<br><em>todo se transforma</em></h1>
      <p class="sub">¿Dónde queda el esfuerzo cuando el hacer se automatiza?</p>
    </header>

    <nav id="modos">
      <button data-modo="1"><span>1</span> Construir</button>
      <button data-modo="2"><span>2</span> Prompt</button>
      <button data-modo="3"><span>3</span> Cierre</button>
    </nav>

    <section id="energia">
      <article class="tarjeta" id="tarjeta-construir">
        <h2>Construir</h2>
        <p class="cifra"><span class="total">2000</span><small>energía total</small></p>
        <div class="barra"><i class="seg forma"></i><i class="seg decisiones"></i><i class="seg libre"></i></div>
        <ul>
          <li><b class="punto forma"></b>forma <span class="val forma">0</span></li>
          <li><b class="punto decisiones"></b>decisiones <span class="val decisiones">0</span></li>
          <li><b class="punto libre"></b>libre <span class="val libre">0</span></li>
        </ul>
        <p class="extra"></p>
      </article>
      <article class="tarjeta" id="tarjeta-prompt">
        <h2>Prompt</h2>
        <p class="cifra"><span class="total">2000</span><small>energía total</small></p>
        <div class="barra"><i class="seg forma"></i><i class="seg decisiones"></i><i class="seg libre"></i></div>
        <ul>
          <li><b class="punto forma"></b>forma <span class="val forma">0</span></li>
          <li><b class="punto decisiones"></b>decisiones <span class="val decisiones">0</span></li>
          <li><b class="punto libre"></b>libre <span class="val libre">0</span></li>
        </ul>
        <p class="extra"></p>
      </article>
    </section>

    <footer>
      <p id="pista"></p>
      <div id="acciones">
        <button data-accion="generar" class="principal">Generar</button>
        <button data-accion="descartar">Descartar</button>
        <button data-accion="reiniciar" class="suave">Reiniciar</button>
      </div>
    </footer>
  </div>
</body>
</html>
